# ViralFactory sources config
# Generated by Sources Engine playbook (Part A) — re-run 2026-07-04 with Obsidian export seeds.
# All monitoring targets — feeds, channels, search queries.

# Verified 2026-07-25 with feedparser before adding. These deliberately cover
# regional development/MSMEs, Caribbean entrepreneurship, and AI trends;
# Caribbean travel journalism remains excluded.
feeds:
  - name: "Caribbean Development Bank"
    url: "https://www.caribank.org/news-events-feed/rss.xml"
    type: "rss"
    enabled: true
  - name: "Caribbean Export"
    url: "https://carib-export.com/feed/"
    type: "rss"
    enabled: true
  - name: "MIT Technology Review"
    url: "https://www.technologyreview.com/feed/"
    type: "rss"
    enabled: true

channels:
  - name: "Jordan Peterson"
    platform: "youtube"
    handle: "@JordanBPeterson"
    channel_id: "UC_4hsKk8MW-r7JwAz5h7DrA"
    enabled: true

# Rotation metadata for the query-ingestion runner. The pool has current-data
# and timeless entries; date_window_months applies only where recency is
# required.
query_rotation:
  per_cycle: 4
  seed: "calendar-week"
queries:
  - query: "Caribbean ROSCA sou-sou economics financial solidarity"
    engine: "exa"
    enabled: true
  - query: "AI impact on Caribbean media and digital transformation"
    engine: "exa"
    enabled: true
  - query: "Klontz money scripts financial behavior psychology"
    engine: "duckduckgo"
    enabled: true
  - query: "Airbnb automation ChatGPT passive income strategy"
    engine: "duckduckgo"
    enabled: true
  - query: "financial literacy Barbados Bahamas ECCU survey"
    engine: "exa"
    enabled: true
    date_window_months: 24
  - query: "Caribbean small business AI adoption digital transformation"
    engine: "exa"
    enabled: true
    date_window_months: 24
  - query: "Caribbean MSME access to finance entrepreneurship data"
    engine: "exa"
    enabled: true
    date_window_months: 24
  - query: "Caribbean diaspora investing wealth building"
    engine: "duckduckgo"
    enabled: true
  - query: "behavioral finance money scripts saving habits research"
    engine: "duckduckgo"
    enabled: true
  - query: "Caribbean technology startup funding innovation"
    engine: "exa"
    enabled: true
    date_window_months: 24

